<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111315" />
    <meta name="description" content="A private workspace for everyday developer utilities." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>DevOps Toolkit</title>
    <script>
      try {
        const theme = localStorage.getItem('devops-toolkit.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (_) {}
    </script>
  </head>
  <body class="min-h-screen min-w-[360px] bg-background font-sans text-foreground antialiased transition-[background-color,color] duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
